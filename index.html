<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการพัฒนาตนเองของครู v2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .main {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
        }

        .logs-list {
            display: grid;
            gap: 20px;
        }

        .log-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .log-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .log-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .log-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .hidden {
            display: none;
        }

        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .nav {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-graduation-cap"></i> ระบบบันทึกการพัฒนาตนเองของครู</h1>
            <p>Teacher Development Log System v2.0</p>

            <div class="nav">
                <button class="btn btn-primary" data-action="profile">
                    <i class="fas fa-user"></i> โปรไฟล์
                </button>
                <button class="btn btn-primary" data-action="categories">
                    <i class="fas fa-tags"></i> จัดการประเภท
                </button>
                <button class="btn btn-primary" data-action="google-sync">
                    <i class="fas fa-cloud"></i> Google Sync
                </button>
                <button class="btn btn-primary" data-action="export">
                    <i class="fas fa-download"></i> ส่งออกข้อมูล
                </button>
                <button class="btn btn-primary" data-action="charts">
                    <i class="fas fa-chart-bar"></i> กราฟสถิติ
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Statistics -->
            <div class="stats" id="stats"></div>

            <!-- Add New Activity Form -->
            <div class="form-section">
                <h2><i class="fas fa-plus-circle"></i> เพิ่มบันทึกใหม่</h2>
                <form id="activityForm">
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> วันที่</label>
                        <input type="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> หัวข้อกิจกรรม</label>
                        <input type="text" name="title" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> ประเภท</label>
                        <select name="category" id="categorySelect" required></select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> จำนวนชั่วโมง</label>
                        <input type="number" name="hours" step="0.5" min="0" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-laptop"></i> รูปแบบ</label>
                        <select name="format" required>
                            <option value="onsite">Onsite</option>
                            <option value="online">Online</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-certificate"></i> เกียรติบัตร/หลักฐาน</label>
                        <div class="file-upload" data-upload="certificates">
                            <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: #667eea; margin-bottom: 10px;"></i>
                            <p>คลิกหรือลากไฟล์มาวางที่นี่</p>
                            <small>รองรับทุกประเภทไฟล์</small>
                        </div>
                        <input type="file" id="fileInput" class="hidden" multiple accept="*/*">
                        <div class="file-list" id="fileList"></div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> รายละเอียด</label>
                        <textarea name="description" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-save"></i> บันทึก
                    </button>
                </form>
            </div>

            <!-- Filters -->
            <div class="filters">
                <select id="filterCategory">
                    <option value="">ทุกประเภท</option>
                </select>
                <select id="filterFormat">
                    <option value="">ทุกรูปแบบ</option>
                    <option value="onsite">Onsite</option>
                    <option value="online">Online</option>
                    <option value="hybrid">Hybrid</option>
                </select>
                <input type="text" id="searchInput" placeholder="ค้นหา...">
            </div>

            <!-- Logs List -->
            <h2><i class="fas fa-list"></i> รายการบันทึก</h2>
            <div class="logs-list" id="logsList"></div>
        </div>
    </div>

    <!-- Sync Status -->
    <div class="sync-status hidden" id="syncStatus">
        <i class="fas fa-sync spinner"></i>
        <span>กำลัง sync...</span>
    </div>

    <!-- Modals -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>รายละเอียด</h2>
                <button class="close-btn" data-close="viewModal">&times;</button>
            </div>
            <div id="viewContent"></div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>แก้ไข</h2>
                <button class="close-btn" data-close="editModal">&times;</button>
            </div>
            <form id="editForm">
                <!-- Will be populated dynamically -->
            </form>
        </div>
    </div>

    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>จัดการประเภท</h2>
                <button class="close-btn" data-close="categoryModal">&times;</button>
            </div>
            <div id="categoryContent"></div>
        </div>
    </div>

    <div class="modal" id="googleSyncModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Google Sync Settings</h2>
                <button class="close-btn" data-close="googleSyncModal">&times;</button>
            </div>
            <div id="googleSyncContent"></div>
        </div>
    </div>

    <script src="app-new.js"></script>
</body>
</html>
