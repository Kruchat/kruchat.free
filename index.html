<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอปบันทึกการพัฒนาตนเองของครู</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .stat-card:nth-child(1) .stat-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-card:nth-child(2) .stat-icon {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .stat-card:nth-child(3) .stat-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .stat-info h3 {
            color: #333;
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-info p {
            color: #666;
            font-size: 1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .form-container, .logs-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-container h2, .logs-container h2 {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Sarabun', sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .btn-edit {
            background: #4facfe;
            color: white;
        }

        .btn-delete {
            background: #f5576c;
            color: white;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Sarabun', sans-serif;
        }

        .filters .btn {
            padding: 10px 20px;
        }

        .logs-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .log-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .log-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .log-title {
            flex: 1;
        }

        .log-title h3 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .log-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            color: #666;
            font-size: 0.9rem;
        }

        .log-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .log-category {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .category-training { background: #e3f2fd; color: #1976d2; }
        .category-seminar { background: #f3e5f5; color: #7b1fa2; }
        .category-selfstudy { background: #e8f5e9; color: #388e3c; }
        .category-research { background: #fff3e0; color: #f57c00; }
        .category-plc { background: #fce4ec; color: #c2185b; }
        .category-other { background: #f5f5f5; color: #616161; }

        .log-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .log-actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.2rem;
        }

        .export-container {
            margin-top: 20px;
            text-align: right;
        }

        .btn-export {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        /* Scrollbar styling */
        .logs-list::-webkit-scrollbar {
            width: 8px;
        }

        .logs-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .logs-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .logs-list::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            color: white;
        }

        .close {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s ease;
        }

        .close:hover {
            transform: scale(1.2);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            padding: 20px 30px;
            background: #f8f9fa;
            border-radius: 0 0 15px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-graduation-cap"></i> แอปบันทึกการพัฒนาตนเองของครู</h1>
            <p>บันทึกและติดตามการพัฒนาวิชาชีพของคุณ</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalActivities">0</h3>
                    <p>กิจกรรมทั้งหมด</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalHours">0</h3>
                    <p>ชั่วโมงรวม</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="stat-info">
                    <h3 id="thisMonth">0</h3>
                    <p>กิจกรรมเดือนนี้</p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="form-container">
                <h2><i class="fas fa-plus-circle"></i> เพิ่มบันทึกใหม่</h2>
                <form id="logForm">
                    <div class="form-group">
                        <label for="activityDate">วันที่</label>
                        <input type="date" id="activityDate" required>
                    </div>

                    <div class="form-group">
                        <label for="activityTitle">หัวข้อกิจกรรม</label>
                        <input type="text" id="activityTitle" placeholder="เช่น อบรมเชิงปฏิบัติการ..." required>
                    </div>

                    <div class="form-group">
                        <label for="activityCategory">ประเภทกิจกรรม</label>
                        <select id="activityCategory" required>
                            <option value="">-- เลือกประเภท --</option>
                            <option value="training">อบรม</option>
                            <option value="seminar">สัมมนา</option>
                            <option value="selfstudy">ศึกษาด้วยตนเอง</option>
                            <option value="research">วิจัย</option>
                            <option value="plc">ชุมชนการเรียนรู้ทางวิชาชีพ (PLC)</option>
                            <option value="other">อื่นๆ</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="activityHours">ระยะเวลา (ชั่วโมง)</label>
                        <input type="number" id="activityHours" min="0" step="0.5" placeholder="เช่น 3" required>
                    </div>

                    <div class="form-group">
                        <label for="activityDescription">รายละเอียด/บันทึกการเรียนรู้</label>
                        <textarea id="activityDescription" placeholder="บันทึกสิ่งที่ได้เรียนรู้..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> บันทึก
                    </button>
                </form>
            </div>

            <div class="logs-container">
                <h2><i class="fas fa-list"></i> รายการบันทึก</h2>

                <div class="filters">
                    <select id="filterCategory">
                        <option value="">ทุกประเภท</option>
                        <option value="training">อบรม</option>
                        <option value="seminar">สัมมนา</option>
                        <option value="selfstudy">ศึกษาด้วยตนเอง</option>
                        <option value="research">วิจัย</option>
                        <option value="plc">ชุมชนการเรียนรู้ทางวิชาชีพ (PLC)</option>
                        <option value="other">อื่นๆ</option>
                    </select>

                    <input type="month" id="filterMonth" placeholder="เดือน">

                    <button class="btn btn-secondary btn-small" onclick="clearFilters()">
                        <i class="fas fa-redo"></i> รีเซ็ต
                    </button>
                </div>

                <div class="logs-list" id="logsList">
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>ยังไม่มีบันทึก เริ่มเพิ่มบันทึกของคุณได้เลย!</p>
                    </div>
                </div>

                <div class="export-container">
                    <button class="btn btn-export btn-small" onclick="exportToCSV()">
                        <i class="fas fa-file-export"></i> ส่งออกเป็น CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> แก้ไขบันทึก</h2>
                <button class="close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">

                    <div class="form-group">
                        <label for="editDate">วันที่</label>
                        <input type="date" id="editDate" required>
                    </div>

                    <div class="form-group">
                        <label for="editTitle">หัวข้อกิจกรรม</label>
                        <input type="text" id="editTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="editCategory">ประเภทกิจกรรม</label>
                        <select id="editCategory" required>
                            <option value="training">อบรม</option>
                            <option value="seminar">สัมมนา</option>
                            <option value="selfstudy">ศึกษาด้วยตนเอง</option>
                            <option value="research">วิจัย</option>
                            <option value="plc">ชุมชนการเรียนรู้ทางวิชาชีพ (PLC)</option>
                            <option value="other">อื่นๆ</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editHours">ระยะเวลา (ชั่วโมง)</label>
                        <input type="number" id="editHours" min="0" step="0.5" required>
                    </div>

                    <div class="form-group">
                        <label for="editDescription">รายละเอียด/บันทึกการเรียนรู้</label>
                        <textarea id="editDescription" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">ยกเลิก</button>
                <button class="btn btn-primary" onclick="saveEdit()">
                    <i class="fas fa-save"></i> บันทึกการแก้ไข
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        let logs = JSON.parse(localStorage.getItem('teacherLogs')) || [];

        // Set today's date as default
        document.getElementById('activityDate').valueAsDate = new Date();

        // Category labels
        const categoryLabels = {
            training: 'อบรม',
            seminar: 'สัมมนา',
            selfstudy: 'ศึกษาด้วยตนเอง',
            research: 'วิจัย',
            plc: 'ชุมชนการเรียนรู้ทางวิชาชีพ (PLC)',
            other: 'อื่นๆ'
        };

        // Form submission
        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const log = {
                id: Date.now(),
                date: document.getElementById('activityDate').value,
                title: document.getElementById('activityTitle').value,
                category: document.getElementById('activityCategory').value,
                hours: parseFloat(document.getElementById('activityHours').value),
                description: document.getElementById('activityDescription').value,
                createdAt: new Date().toISOString()
            };

            logs.push(log);
            saveLogs();
            this.reset();
            document.getElementById('activityDate').valueAsDate = new Date();

            renderLogs();
            updateStats();

            // Show success animation
            showNotification('บันทึกสำเร็จ!', 'success');
        });

        // Filter listeners
        document.getElementById('filterCategory').addEventListener('change', renderLogs);
        document.getElementById('filterMonth').addEventListener('change', renderLogs);

        // Save logs to localStorage
        function saveLogs() {
            localStorage.setItem('teacherLogs', JSON.stringify(logs));
        }

        // Render logs
        function renderLogs() {
            const filterCategory = document.getElementById('filterCategory').value;
            const filterMonth = document.getElementById('filterMonth').value;

            let filteredLogs = logs;

            // Filter by category
            if (filterCategory) {
                filteredLogs = filteredLogs.filter(log => log.category === filterCategory);
            }

            // Filter by month
            if (filterMonth) {
                filteredLogs = filteredLogs.filter(log => {
                    const logMonth = log.date.substring(0, 7); // YYYY-MM
                    return logMonth === filterMonth;
                });
            }

            // Sort by date (newest first)
            filteredLogs.sort((a, b) => new Date(b.date) - new Date(a.date));

            const logsList = document.getElementById('logsList');

            if (filteredLogs.length === 0) {
                logsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>ไม่พบบันทึกตามเงื่อนไขที่เลือก</p>
                    </div>
                `;
                return;
            }

            logsList.innerHTML = filteredLogs.map(log => `
                <div class="log-card">
                    <div class="log-header">
                        <div class="log-title">
                            <span class="log-category category-${log.category}">
                                ${categoryLabels[log.category]}
                            </span>
                            <h3>${log.title}</h3>
                            <div class="log-meta">
                                <span><i class="fas fa-calendar"></i> ${formatDateThai(log.date)}</span>
                                <span><i class="fas fa-clock"></i> ${log.hours} ชั่วโมง</span>
                            </div>
                        </div>
                    </div>
                    <div class="log-description">
                        ${log.description}
                    </div>
                    <div class="log-actions">
                        <button class="btn btn-edit btn-small" onclick="editLog(${log.id})">
                            <i class="fas fa-edit"></i> แก้ไข
                        </button>
                        <button class="btn btn-delete btn-small" onclick="deleteLog(${log.id})">
                            <i class="fas fa-trash"></i> ลบ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const totalActivities = logs.length;
            const totalHours = logs.reduce((sum, log) => sum + log.hours, 0);

            const currentMonth = new Date().toISOString().substring(0, 7);
            const thisMonth = logs.filter(log => log.date.startsWith(currentMonth)).length;

            document.getElementById('totalActivities').textContent = totalActivities;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('thisMonth').textContent = thisMonth;
        }

        // Edit log
        function editLog(id) {
            const log = logs.find(l => l.id === id);
            if (!log) return;

            document.getElementById('editId').value = log.id;
            document.getElementById('editDate').value = log.date;
            document.getElementById('editTitle').value = log.title;
            document.getElementById('editCategory').value = log.category;
            document.getElementById('editHours').value = log.hours;
            document.getElementById('editDescription').value = log.description;

            document.getElementById('editModal').style.display = 'block';
        }

        // Save edit
        function saveEdit() {
            const id = parseInt(document.getElementById('editId').value);
            const logIndex = logs.findIndex(l => l.id === id);

            if (logIndex === -1) return;

            logs[logIndex] = {
                ...logs[logIndex],
                date: document.getElementById('editDate').value,
                title: document.getElementById('editTitle').value,
                category: document.getElementById('editCategory').value,
                hours: parseFloat(document.getElementById('editHours').value),
                description: document.getElementById('editDescription').value
            };

            saveLogs();
            renderLogs();
            updateStats();
            closeEditModal();

            showNotification('แก้ไขสำเร็จ!', 'success');
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Delete log
        function deleteLog(id) {
            if (!confirm('คุณแน่ใจหรือไม่ที่จะลบบันทึกนี้?')) return;

            logs = logs.filter(log => log.id !== id);
            saveLogs();
            renderLogs();
            updateStats();

            showNotification('ลบสำเร็จ!', 'success');
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterMonth').value = '';
            renderLogs();
        }

        // Export to CSV
        function exportToCSV() {
            if (logs.length === 0) {
                alert('ไม่มีข้อมูลให้ส่งออก');
                return;
            }

            let csv = '\uFEFF'; // BOM for UTF-8
            csv += 'วันที่,หัวข้อ,ประเภท,ชั่วโมง,รายละเอียด\n';

            logs.forEach(log => {
                csv += `"${formatDateThai(log.date)}","${log.title}","${categoryLabels[log.category]}","${log.hours}","${log.description.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `teacher-development-log-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showNotification('ส่งออกสำเร็จ!', 'success');
        }

        // Format date to Thai
        function formatDateThai(dateString) {
            const date = new Date(dateString);
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
                              'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

            const day = date.getDate();
            const month = thaiMonths[date.getMonth()];
            const year = date.getFullYear() + 543;

            return `${day} ${month} ${year}`;
        }

        // Show notification
        function showNotification(message, type) {
            // Simple notification (you can enhance this with a toast library)
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#4caf50' : '#f44336'};
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        };

        // Add animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(400px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initial render
        renderLogs();
        updateStats();
    </script>
</body>
</html>
